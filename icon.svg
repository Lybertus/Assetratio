<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Emerald Invest Gradient -->
    <linearGradient id="grad-invest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Cash Gradient -->
    <linearGradient id="grad-cash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="0%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Filter for subtle glow -->
    <filter id="glow-invest" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-cash" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg-glow)" stroke="#27272a" stroke-width="2"/>

  <!-- Subtle background ring track -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#222225" stroke-width="38" stroke-linecap="round"/>

  <!-- Cash Ring Arc (approx 25%, cyan) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#grad-cash)" stroke-width="38"
          stroke-dasharray="245 1005" stroke-dashoffset="-750" stroke-linecap="round" filter="url(#glow-cash)"/>

  <!-- Invested Ring Arc (approx 75%, green) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#grad-invest)" stroke-width="38"
          stroke-dasharray="715 1005" stroke-dashoffset="0" stroke-linecap="round" filter="url(#glow-invest)"/>

  <!-- Center Symbol (%) -->
  <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-size="96" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">
    %
  </text>
  <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
        font-size="20" font-weight="600" fill="#A1A1AA" text-anchor="middle" letter-spacing="3">
    RATIO
  </text>
</svg>
